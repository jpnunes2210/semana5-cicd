# Stack de PRODUCAO: so o Nginx publica portas no host (80 e 443).
# Uso:
#   ./scripts/gerar-certificado.sh
#   cp .env.prod.example .env.prod   (ajuste as senhas)
#   docker compose -f docker-compose-prod.yml up -d --build
services:
  db:
    image: postgres:16-alpine
    env_file: .env.prod
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [internal]
    restart: unless-stopped
    # sem "ports": 5432 so existe na rede interna

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    env_file: .env.prod
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DJANGO_DEBUG: "False"
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    expose:
      - "3000"
    depends_on:
      - backend
    networks: [internal]
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
    networks: [internal]
    restart: unless-stopped

networks:
  internal:

volumes:
  postgres_data_prod:
