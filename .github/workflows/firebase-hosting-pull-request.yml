# Pull request: qualidade -> build estatico -> canal de pre-visualizacao -> teste de fumaca
name: Preview no Firebase Hosting (pull request)

on:
  pull_request:

permissions:
  checks: write
  contents: read
  pull-requests: write

# Um push novo no mesmo PR cancela o preview anterior que ainda estiver rodando
concurrency:
  group: firebase-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  FIREBASE_PROJECT_ID: semana6-jpnunes

jobs:
  qualidade:
    # PR de fork nao tem acesso aos secrets
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/frontend-qualidade.yml

  build:
    needs: qualidade
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Export estatico lendo do Firestore
        run: npm run build:static
        env:
          NEXT_PUBLIC_DATA_SOURCE: firestore
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: frontend/out
          retention-days: 1

  preview:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.details_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: frontend/out
      - name: Deploy em canal de pre-visualizacao (comenta a URL no PR)
        id: deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SEMANA6_JPNUNES }}
          projectId: ${{ env.FIREBASE_PROJECT_ID }}
          expires: 7d

  smoke-test:
    needs: preview
    runs-on: ubuntu-latest
    steps:
      - name: curl --fail na URL de preview
        env:
          URL: ${{ needs.preview.outputs.url }}
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors -o page.html "$URL"
          grep -q "Painel DevOps" page.html
          echo "Preview respondendo em $URL"
